name: Release

# Crea un GitHub Release con notas autogeneradas cada vez que se empuja un
# tag "vX.Y.Z". Por ahora no adjunta binarios: eso se conecta cuando esté
# lista la Fase 5 (empaquetado con PyInstaller).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
