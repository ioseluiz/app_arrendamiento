name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    # macOS porque la app usa PySide6-WebEngine y QtCharts; en Linux estos
    # módulos requieren librerías del sistema adicionales que no vienen en
    # el runner por defecto. macOS coincide además con la plataforma objetivo.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Chequeo de arranque (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_check.py
